version = 1
id = "ai-pm"
kind = "cron"
name = "每日 AI PM 行业雷达"
prompt = """
请生成今日“AI PM 行业雷达”，面向一个正在成长为全栈型 AI 产品经理和个人独立开发者的用户。当前日期按运行时日期，时区 Asia/Shanghai。
所有文件路径均相对于仓库根目录（CortexOps 项目根）。不要使用 /Users/... 绝对路径。运行时工作目录即为仓库根目录。

基础规则：
- 优先遵循 docs/source-policy.md。
- 采集、字段标准化、JSONL 状态、候选池路由、去重和人工确认规则优先遵循 docs/ingestion-normalization.md。
- 用户当前注意力、GitHub 实践适配度和求职面试证明力规则优先遵循 docs/focus-policy.md。
- AIhot 采集契约优先遵循 docs/aihot-api.md；GitHub/arXiv 补充契约遵循 docs/supplemental-prefetch-api.md。
- 先读取 state/memory/ai-pm-7d.jsonl 做 7 天去重；再用最近日报 Markdown 作为补充复核。

总目标：
日报不是只生成一篇自然语言摘要，而是维护一个文件驱动的信息工作台。请先形成结构化链接状态，再生成用户阅读版日报。用户端最终应先看到五段式方向判断，再看今日 30mins 阅读包，然后处理未入选阅读包的剩余链接和今日练习。每条链接后面带 AI 建议池、优先级、阅读包状态、人工确认状态；若 7 天内重复但因 material_update 或 carry_over 被保留，直接在该链接后注明原因。

必须维护的状态文件：
- state/daily/YYYY-MM-DD-links.jsonl
- state/daily/YYYY-MM-DD-report.md
- state/memory/ai-pm-7d.jsonl
- pools/product-inspiration.jsonl
- pools/paper-candidates.jsonl
- pools/demo-replication.jsonl
- pools/knowledge-gap.jsonl
- pools/personal-work.jsonl
- pools/archive.jsonl

AIhot 采集（两阶段，strict 默认）：

Phase 0 — Ingest 门禁（必须先于任何采集/写入）：
0. 读取 state/daily/.ingest-mode（默认 strict）。
1. 运行：python3 scripts/verify-daily-ingest.py <今日 YYYY-MM-DD>
   - exit 0 → 继续 Phase 1
   - exit 非 0 → **立即停止**：
     a. 若 manifest 不存在或 ready=false，读取 state/daily/YYYY-MM-DD-ingest-error.json（若存在）总结原因
     b. 写入/更新 state/daily/YYYY-MM-DD-ingest-error.md（人可读，说明需在 Terminal 运行 ./scripts/ai-pm-ingest-prefetch.sh）
     c. **不得**创建或覆盖 state/daily/YYYY-MM-DD-links.jsonl、state/daily/YYYY-MM-DD-report.md、pools 写入
     d. 向用户返回明确错误并 exit
2. strict 模式下 **禁止**在 Codex / Cursor sandbox 内 curl、fetch 或 Web 访问任何外网 URL，包括但不限于 AIhot、GitHub、arXiv、官网、Trending；不得 Web fallback 凑 longlist。

Phase 1 — 从 Terminal prefetch raw 映射（禁止 sandbox curl）：
1. 读取 state/daily/YYYY-MM-DD-ingest-manifest.json 与 state/daily/YYYY-MM-DD-aihot-raw.json（manifest 已验证）。
2. AIhot 映射 — 对 raw.items[] 逐条映射（见 docs/aihot-api.md）：
   - aihot_id ← item.id
   - source_url ← https://aihot.virxact.com/items/{item.id}
   - original_url ← item.url
   - title ← item.title
   - aihot_summary ← item.summary（verbatim，禁止改写/压缩）
   - display_summary ← item.summary（同 aihot_summary）
   - aihot_summary_status ← verified
   - source_origin ← aggregator；source_role ← daily_discovery
3. 硬门禁（写入 JSONL 前自检）：
   - 无 aihot_id → aihot_summary 必须为空，aihot_summary_status=not_applicable
   - 有 aihot_id → aihot_summary 非空且来自 raw item.summary；禁止自写一句压缩
   - 禁止用 ai-bot.cn 内容填入 aihot_summary；禁止 10 条共用同一列表 source_url
4. GitHub / arXiv 补充 — **仅读 prefetch raw，禁止 sandbox curl**（映射见 docs/supplemental-prefetch-api.md）：
   a. arXiv：仅当 manifest.sources.arxiv.status==ok **且** state/daily/YYYY-MM-DD-arxiv-raw.xml 存在 → 解析 Atom `<entry>` 补充 longlist：
      - original_url ← https://arxiv.org/abs/{id}
      - title ← `<title>`（去换行）
      - discovery_summary ← `<summary>` verbatim
      - source_origin ← primary；source_mix_note ← arxiv_export_supplement
      - aihot_id 空；aihot_summary 空；aihot_summary_status ← not_applicable
   b. GitHub：仅当 manifest.sources.github.status==ok **且** state/daily/YYYY-MM-DD-github-raw.json 存在 → 读取 items[] 补充：
      - original_url ← html_url
      - title ← full_name（或 description 首句作副标题）
      - discovery_summary ← description（非空则 verbatim）
      - source_origin ← primary；source_mix_note ← github_search_supplement
      - aihot_id 空；aihot_summary 空；aihot_summary_status ← not_applicable
   c. manifest status==skipped 或 raw 缺失 → 该源 **必须 skip**；§1 写 arxiv_supplement=skipped_no_prefetch 或 github_supplement=skipped_no_prefetch。
   d. supplemental 与 AIhot 经 canonical_key 去重后并入 longlist；不得伪造链接。
   e. supplemental 全部跳过时：允许 AIhot-only longlist；须在 report 说明原因。
5. §1 采集状态行必须写：ingest_mode、manifest_ready、prefetch_host、aihot_items、arxiv_items、github_items、arxiv_supplement=ok|skipped_no_prefetch、github_supplement=ok|skipped_no_prefetch。
6. resilient 模式（ingest_mode=resilient 时）：才允许原 fallback——report 披露 API 失败、aihot_summary 全空、外网补充；strict 下不适用。

采集与长清单规则：
1. AIhot 是 daily_discovery 主入口。有 supplemental raw 时评估 GitHub/arXiv 补充；**无 supplemental raw 时允许 AIhot-only longlist**，但须在 report 披露 skip 原因。
2. 建议配比（有 supplemental raw 时）：AIhot 约 18-24 条；官方/一手 2-5；产品案例 1-3；GitHub/release 2-4。若最终全部来自 AIhot，必须在 report 说明其他来源未补充的原因。
3. 非 AIhot 补充来源应写入 source_mix_note，说明为什么补充进入 longlist，尤其是产品案例如何帮助建立产品思路。
4. AIhot 条目使用 AIhot 标题作为日报标题候选；确认原始来源链接后，把 AIhot 摘要写入 aihot_summary。
5. P0/P1、30 分钟阅读包、GitHub 主推和正式练习必须尽量指向原始来源 URL，而不是 AIhot 聚合页。
6. Codex 自己的判断写入 codex_summary 和 reason，不能和 AIhot 摘要混在一起。
7. 每条链接都给 suggested_pool；AI 建议不是最终入池决定，human_status 默认 pending。

每条 JSONL link object 至少包含：
id, date, title, original_url, source_url, source_origin, source_name, source_mix_note, aihot_id, aihot_summary, aihot_summary_status, discovery_summary, codex_summary, display_summary, priority, reading_pack_status, suggested_pool, human_status, final_pool, canonical_key, duplicate_status, novelty_reason, practice_fit, reason, read_reason, focus_direction, known_facts, open_questions。
其中：aihot_summary 仅 AIhot API verified 条目；discovery_summary 供非 AIhot 聚合页摘要；display_summary：verified AIhot 条目等于 aihot_summary；非 AIhot 从 discovery_summary 或原文事实提取。read_reason/focus_direction 仅阅读包非 knowledge_gap 条目填写；known_facts/open_questions 仅 knowledge_gap 条目填写；去重/保留说明只写入 novelty_reason，reason 不得复述。

写入规则：
- 所有采集链接先写入 state/daily/YYYY-MM-DD-links.jsonl。
- 用户阅读版写入 state/daily/YYYY-MM-DD-report.md。
- 入选 30 分钟阅读包、GitHub 主推、正式练习、候选池 pending/confirmed/changed 的链接写入 state/memory/ai-pm-7d.jsonl。
- AI 建议进入候选池的链接写入对应 pools/*.jsonl，human_status: pending，final_pool 默认等于 suggested_pool。
- 产品灵感池只保留手动确认或人工改入的候选；日报不要自动生成“今日 AI 产品灵感”段落。

用户阅读版输出结构：

# 今日 AI PM 行业雷达

## 1. 五段式日报
§1 开头必须包含一行采集状态：ingest_mode、manifest_ready、prefetch_host、aihot_items、arxiv_supplement、github_supplement（ok 或 skipped_no_prefetch）。
用五段判断今天的大方向：产品/行业动态、GitHub/工程信号、论文/研究信号、工具/工作流信号、风险/限制/反例。

## 2. 今日 30mins 阅读包
按阅读顺序列出 P0 详细阅读、P1 扫读和 GitHub 热门/可复刻项目，不要另列为独立顶层章节。每条首行：标题、原始链接、类别（P0 详细阅读 / P1 扫读 / GitHub 热门或可复刻项目）、建议池、human_status。随后：
- 摘要：display_summary（AIhot 直接用 aihot_summary，纯事实，不加解读）。
- 若建议池不是 knowledge_gap：给「推荐阅读原因」（read_reason，一句）和「关注方向」（focus_direction，读时关注的角度，不要臆造文章未必包含的细节）。不要再输出"读的时候看/读完判断"模板句。
- 若建议池是 knowledge_gap：改为两部分——「文章可获得的事实」（known_facts，从文章本身能得到的事实点）与「需要额外研究的问题」（open_questions，读完仍需另行查证的问题）。
"P0 详细阅读"仅用于确有深度的来源；若来源只是产品功能/发布介绍页（信息浅），降为 P1 扫读，靠摘要让用户判断，不要为凑深度而过度解读。

## 3. 未入选阅读包的剩余链接
列出剩余链接，尽量保持今日信息面完整。每条首行标注：优先级、AI 建议池、reading_pack_status、human_status、是否建议人工加入阅读包；非 AIhot 补充来源标注 source_mix_note。随后另起一行给「摘要」（display_summary，AIhot 用 aihot_summary，纯事实）。剩余链接不写推荐阅读原因/关注方向，克制解读。
去重/保留说明只出现一次：仅当 duplicate_status 为 material_update / carry_over / duplicate_suppressed 时，追加一行「保留/去重说明：<duplicate_status> — <novelty_reason>」。novelty_reason 只写一次，reason 不得复述该内容。

## 4. 今日练习三选一
给 3 个 20-45 分钟练习选项，并明确选择其中 1 个作为正式练习。未选的 2 个给人工去向建议：产品灵感池、每周 Demo 候选池、archive 或 drop。

质量要求：
- 必须提供可点击来源链接。
- 区分事实、AIhot 摘要、原作者观点、Codex 判断。
- 长清单要完整，阅读包要克制。
- 候选池建议只作为每条链接的状态字段和 UI 标签输出，不要额外生成“候选池建议表”段落。
- 不要为了凑数加入不可验证、过期或低质量链接。
- 每条链接都要有 display_summary；AIhot 来源直接复用 aihot_summary，不改写。
- 事实、AIhot 摘要、Codex 判断分离；剩余链接以事实摘要为主，克制解读。
- 去重/保留原因只写入 novelty_reason，并在报告中只呈现一次，reason 不复述。
- knowledge_gap 用“可获得的事实 + 需要额外研究的问题”呈现，不假装给出文章未包含的判断。
"""
