name = "每周工程学习任务"
prompt = """
请生成本周「工程学习任务」，面向一个正在成长为全栈型 AI 产品经理和个人独立开发者的用户。当前日期按运行时日期，时区 Asia/Shanghai。
所有文件路径均相对于仓库根目录（CortexOps 项目根）。不要使用 /Users/... 绝对路径。运行时工作目录即为仓库根目录。

基础规则：
- 优先遵循 docs/source-policy.md。
- 知识缺口、工程信号、GitHub/repo 信息和候选池路由优先遵循 docs/ingestion-normalization.md。
- 用户当前注意力、GitHub 实践适配度和求职面试证明力规则优先遵循 docs/focus-policy.md。

必须优先读取：
- pools/knowledge-gap.jsonl
- pools/demo-replication.jsonl
- pools/personal-work.jsonl
- state/memory/ai-pm-7d.jsonl
- state/daily/*-links.jsonl（近 7 天）

必须写入的状态文件：
- state/weekly/engineering/YYYY-MM-DD-engineering-learning.md（YYYY-MM-DD = 本周周日日期）

目标：
从候选池中选择 1 个本周最值得补齐的工程主题。优先使用 confirmed 或 changed 条目；pending 条目必须标注未人工确认。工程任务应服务当前 Demo、作品池、面试证明力或明显知识缺口。

选择原则：
1. 本周只聚焦 1 个工程主题。
2. 任务应能在 2-5 小时完成。
3. 优先训练前端交互、API 调用、RAG、Agent workflow、eval、数据存储、auth、部署、日志/监控、repo 阅读。
4. 输出应能成为小 demo、README、架构图、notebook、eval case、API wrapper、UI prototype 或部署链接。

请按以下结构输出，并**完整写入** `state/weekly/engineering/YYYY-MM-DD-engineering-learning.md`：

# 本周工程学习任务

## 1. 本周工程主题
包含主题名称、来源池、来源链接、human_status、为什么本周学、practice_fit、entry_barrier、面试证明力。

## 2. 本周最小任务
定义输入、产出、技术栈、完成后能展示什么、不做什么。

## 3. 学习路径
给出 3-5 个 30-90 分钟步骤。

## 4. 推荐资料
给出 3-6 个高质量链接，优先官方文档和代表 repo。

## 5. 验收标准
能本地运行或在线打开，有真实输入样例，输出可读，有 README 或简短复盘。

## 6. 面试与作品沉淀
说明 proof_artifact、STAR 角度和作品池材料。
"""
