搜索方法：
1. 使用 arXiv API 搜索以下分类的最近 7 天论文：
   - q-bio.NC（Neurons and Cognition，神经元与认知）
   - 用关键词补充搜索：psychology, cognitive science, decision making, reward prediction error, predictive coding, memory consolidation, dopamine, reinforcement learning, attention, perception
2. 从搜索结果中筛选 5 篇，优先选择：
   - 时效性：最近 7 天内发布
   - 权威性：有 journal_ref（已发表在顶刊/会议，如 Nature, Science, Neuron, PNAS, Psychological Science），优先于纯 preprint
   - 引用性：如能通过 Semantic Scholar API 或 web search 查到引用数，优先高引用
   - 跨学科价值：与 AI、agent 设计、认知科学、决策科学有交叉，能启发 AI 产品设计
3. 配比建议：神经科学 2-3 篇，心理学/认知科学 2-3 篇

每篇论文输出格式：
- 标题（英文原标题）
- 期刊/来源（journal_ref，若无标注 "arXiv preprint"）
- arXiv 链接
- 摘要（中文翻译，200 字以内）
