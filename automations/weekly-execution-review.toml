prompt = """
请生成本周「AI PM 执行周报」，面向一个正在成长为全栈型 AI 产品经理和个人独立开发者的用户。当前日期按运行时日期，时区 Asia/Shanghai。
所有文件路径均相对于仓库根目录（CortexOps 项目根）。不要使用 /Users/... 绝对路径。运行时工作目录即为仓库根目录。

基础规则：
- 优先遵循 docs/source-policy.md。
- 信号字段、候选池路由、JSONL 状态、去重和人工确认规则优先遵循 docs/ingestion-normalization.md。
- 用户当前注意力、GitHub 实践适配度和求职面试证明力规则优先遵循 docs/focus-policy.md。

必须优先读取的文件：
- state/memory/ai-pm-7d.jsonl
- state/daily/*-links.jsonl（本周及近 7 天）
- state/daily/*-report.md（本周及近 7 天，作阅读补充；JSONL 仍是主数据源）
- state/weekly/paper/YYYY-MM-DD-paper-radar.md（本周论文雷达输出，用于 §4）
- pools/product-inspiration.jsonl
- pools/paper-candidates.jsonl
- pools/demo-replication.jsonl
- pools/knowledge-gap.jsonl
- pools/personal-work.jsonl
- pools/archive.jsonl

必须写入的状态文件：
- state/weekly/YYYY-MM-DD-report.md（YYYY-MM-DD = 本周周日的日期；若运行日就是周日则用运行日）

周报原则：
1. 不要重复日报，不要做新闻堆砌。
2. 周报正文只做四件事：总结信号、分析偏好、给出调整建议、推荐论文。
3. 池的盘点和看板数据由 Web 端实时展示，周报不再逐一盘点 6 个候选池。
4. 偏好分析基于信号分布（content_tags 频率、置信度分布、池分布变化）。BehaviorEvent 详细行为数据存储在 Web Workbench SQLite 中，如已导出为 JSONL 则一并分析；如未导出，基于信号分布分析并注明。
5. 输出必须服务 2B AI PM、AI workflow、eval、agent/MCP、Vibe Coding 和作品证明力。

请按以下结构输出，并完整写入 state/weekly/YYYY-MM-DD-report.md：

# 本周 AI PM 执行周报

## 1. 过去一周信号总结
从 daily signals、memory 和候选池中归纳 3-5 个本周关键信号趋势。每个趋势包含：代表链接、来源池、置信度、为什么重要。不要逐池盘点——池的状态由 Web 端看板展示。

## 2. 偏好分析
基于本周信号数据，分析用户偏好变化：
- 哪些 content_tags + source_type 组合出现频率最高（本周 Top 5）
- 与上周对比，哪些 tag 在上升、哪些在下降
- 置信度分布：high/medium/low 的比例变化
- 池分布变化：产品/论文/工程练习三个方向的信号占比
- 如果有 BehaviorEvent 导出数据，分析 thumbs up/down 的 tag 分布和预测误差
- 系统对用户偏好的理解发生了什么变化

## 3. 下周调整建议
根据偏好分析和本周积极信号，给出下周调整建议：
- FocusRule 是否需要调整（新增、暂停、修改方向或权重）
- 信息源是否需要增减
- 三个池（产品/论文/工程练习）的注意力分配建议
- 哪些方向值得加大关注，哪些应该降权
- 建议本周优先推进的 1-2 个方向

## 4. 论文推荐
读取 state/weekly/paper/YYYY-MM-DD-paper-radar.md 的内容，将其完整呈现在本节中。
展示 5 篇神经科学/心理学论文（标题、期刊、摘要、AI 关联）。
推荐 1-2 篇最值得深读的，用户选取后在 Web Workbench 转化为论文 Task。
如果论文雷达文件不存在或为空，注明「本周论文雷达未生成，请检查 ai-paper-radar 自动化是否正常运行」。
"""
